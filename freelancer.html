<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowCheck - Freelancer Paneli</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
</head>
<body>
    <nav class="navbar">
        <a href="#" class="navbar-brand"><i class="fas fa-water"></i> FlowCheck</a>
        <div class="navbar-user">
            <span id="userName" style="font-weight: 500;">Yükleniyor...</span>
            <button id="profileBtn" class="btn btn-primary" style="padding: 0.5rem 1rem;"><i class="fas fa-user-circle"></i> Profil</button>
            <button id="logoutBtn" class="btn btn-danger" style="padding: 0.5rem 1rem;"><i class="fas fa-sign-out-alt"></i> Çıkış</button>
        </div>
    </nav>

    <div class="container">
        <!-- Dashboard Top Stats -->
        <div class="dashboard-grid" style="margin-top: 0; margin-bottom: 2rem;">
            <div class="glass-panel card">
                <h3>Aylık Kazanılan Ödeme</h3>
                <h1 id="totalEarned" style="color: var(--success-color); font-size: 2rem; margin-top: 0.5rem;">0 ₺</h1>
            </div>
            <div class="glass-panel card">
                <h3>Aktif İş Sayısı</h3>
                <h1 id="activeJobsCount" style="color: var(--primary-color); font-size: 2rem; margin-top: 0.5rem;">0</h1>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Jobs List -->
            <div class="glass-panel">
                <h2><i class="fas fa-briefcase"></i> Atanan İşler</h2>
                <div id="jobsContainer" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; max-height: 600px; overflow-y: auto;">
                    <!-- İşler buraya gelecek -->
                </div>
            </div>

            <!-- Calendar -->
            <div class="glass-panel">
                <h2><i class="fas fa-calendar-alt"></i> İş Takvimi</h2>
                <div id="calendar"></div>
            </div>
        </div>
    </div>

    <!-- Modal for Push / Submit -->
    <div id="actionModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center;">
        <div class="glass-panel" style="width: 90%; max-width: 500px;">
            <h2 id="modalJobTitle">İşlem</h2>
            
            <div id="pushSection" style="margin-top: 1.5rem;">
                <h4><i class="fab fa-github"></i> Commit Gönder (Simülasyon)</h4>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">Arkaplanda GitHub Webhook'un API'ye göndereceği veriyi simüle eder.</p>
                <div class="form-group">
                    <label>Commit Mesajı</label>
                    <input type="text" id="commitMessage" class="form-control" placeholder="Örn: Login sayfası eklendi">
                </div>
                <button id="sendCommitBtn" class="btn btn-primary" style="width: 100%;">Pushla</button>
                
                <hr style="border: 0; border-top: 1px solid var(--surface-border); margin: 1.5rem 0;">
                
                <h4><i class="fas fa-paper-plane"></i> İşi Teslim Et</h4>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">Kodlarını tamamladığında işverenin onayına sun.</p>
                <button id="submitReviewBtn" class="btn btn-success" style="width: 100%;">Onaya Gönder</button>
            </div>

            <button id="closeModalBtn" class="btn" style="width: 100%; margin-top: 1.5rem; background: transparent; border: 1px solid var(--surface-border); color: white;">Kapat</button>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center;">
        <div class="glass-panel" style="width: 90%; max-width: 400px;">
            <h2><i class="fas fa-user-edit"></i> Profil Bilgileri</h2>
            
            <form id="profileForm" style="margin-top: 1.5rem;">
                <div class="form-group">
                    <label>Ad Soyad / Firma Adı</label>
                    <input type="text" id="profName" class="form-control" disabled>
                </div>
                <div class="form-group">
                    <label>E-posta</label>
                    <input type="email" id="profEmail" class="form-control" disabled>
                </div>
                <div class="form-group">
                    <label>Cüzdan / IBAN</label>
                    <input type="text" id="profWallet" class="form-control" placeholder="Örn: TR1234...">
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-success" style="flex: 1;"><i class="fas fa-save"></i> Kaydet</button>
                    <button type="button" id="closeProfileBtn" class="btn" style="flex: 1; background: transparent; border: 1px solid var(--surface-border); color: white;">İptal</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <script src="db.js"></script>
    <script>
        const currentUser = UserAPI.getCurrentUser();
        if (!currentUser || currentUser.role !== 'Freelancer') {
            window.location.href = 'index.html';
        }

        document.getElementById('userName').innerText = currentUser.name;

        // Profile Logic
        document.getElementById('profileBtn').addEventListener('click', () => {
            const user = UserAPI.getCurrentUser();
            document.getElementById('profName').value = user.name;
            document.getElementById('profEmail').value = user.email;
            document.getElementById('profWallet').value = user.walletAddress || '';
            document.getElementById('profileModal').style.display = 'flex';
        });

        document.getElementById('closeProfileBtn').addEventListener('click', () => {
            document.getElementById('profileModal').style.display = 'none';
        });

        document.getElementById('profileForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newWallet = document.getElementById('profWallet').value;
            UserAPI.updateProfile(currentUser.id, { walletAddress: newWallet });
            document.getElementById('profileModal').style.display = 'none';
            alert('Profil başarıyla güncellendi.');
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            UserAPI.logout();
            window.location.href = 'index.html';
        });

        let calendar;
        let currentActionJobId = null;

        function getStatusBadge(status) {
            switch(status) {
                case 'Assigned': return '<span class="badge badge-assigned">Atandı (Kod Yazılıyor)</span>';
                case 'Review': return '<span class="badge badge-review">Onay Bekleniyor</span>';
                case 'Revision': return '<span class="badge badge-revision">Revize İstendi</span>';
                case 'Paid': return '<span class="badge badge-paid">Ödeme Alındı</span>';
                default: return `<span class="badge">${status}</span>`;
            }
        }

        function loadDashboard() {
            const container = document.getElementById('jobsContainer');
            container.innerHTML = '';
            const jobs = JobAPI.getJobsByFreelancer(currentUser.id);
            
            let totalEarned = 0;
            let activeJobsCount = 0;
            let calendarEvents = [];

            jobs.forEach(job => {
                if (job.status === 'Paid') {
                    totalEarned += parseInt(job.price);
                } else {
                    activeJobsCount++;
                }

                // Add to calendar
                calendarEvents.push({
                    title: job.title + ' (Teslim)',
                    start: job.dueDate,
                    backgroundColor: job.status === 'Paid' ? 'var(--success-color)' : 'var(--primary-color)',
                    borderColor: 'transparent'
                });

                if (job.revisionStartDate && job.revisionEndDate) {
                    calendarEvents.push({
                        title: job.title + ' (Revize)',
                        start: job.revisionStartDate,
                        end: new Date(new Date(job.revisionEndDate).getTime() + 86400000).toISOString().split('T')[0], // Exclusive end date for FC
                        backgroundColor: 'var(--danger-color)',
                        borderColor: 'transparent'
                    });
                }

                const employer = UserAPI.getUserById(job.employerId);
                const card = document.createElement('div');
                card.className = 'card';
                card.style.background = 'rgba(15, 23, 42, 0.4)';
                
                let actionBtn = '';
                if (job.status === 'Assigned' || job.status === 'Revision') {
                    actionBtn = `<button class="btn btn-primary" onclick="openActionModal('${job.id}', '${job.title}')" style="margin-top: 1rem; width: 100%;"><i class="fas fa-laptop-code"></i> Kod İşlemleri</button>`;
                }

                let revisionInfo = '';
                if (job.status === 'Revision') {
                    revisionInfo = `
                        <div style="margin-top: 0.5rem; padding: 0.5rem; background: rgba(239, 68, 68, 0.1); border-left: 3px solid var(--danger-color); border-radius: 4px;">
                            <strong style="color: var(--danger-color); font-size: 0.85rem;">Revize Tarihi:</strong><br>
                            <span style="font-size: 0.85rem;">${job.revisionStartDate} - ${job.revisionEndDate}</span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-header" style="flex-direction: column; gap: 0.5rem;">
                        <div style="display: flex; justify-content: space-between; width: 100%;">
                            <h4 style="margin: 0;">${job.title}</h4>
                            ${getStatusBadge(job.status)}
                        </div>
                    </div>
                    <div style="font-size: 0.9rem; margin-bottom: 0.5rem;">
                        ${job.description}
                    </div>
                    <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem; display: flex; justify-content: space-between;">
                        <span><i class="fas fa-building"></i> ${employer.name}</span>
                        <span style="color: var(--success-color); font-weight: 600;"><i class="fas fa-money-bill-wave"></i> ${job.price} ₺</span>
                    </div>
                    <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                        <i class="fab fa-github"></i> <a href="${job.githubRepoUrl}" target="_blank" style="color: var(--primary-color);">${job.githubRepoUrl}</a>
                    </div>
                    <p style="font-size: 0.85rem; margin-top: 0.5rem;"><i class="far fa-clock"></i> Teslim: ${job.dueDate}</p>
                    ${revisionInfo}
                    ${actionBtn}
                `;
                container.appendChild(card);
            });

            document.getElementById('totalEarned').innerText = totalEarned + ' ₺';
            document.getElementById('activeJobsCount').innerText = activeJobsCount;

            // Render Calendar
            const calendarEl = document.getElementById('calendar');
            if (calendar) {
                calendar.destroy();
            }
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                events: calendarEvents,
                height: 450,
                headerToolbar: {
                    left: 'prev,next',
                    center: 'title',
                    right: 'today'
                }
            });
            calendar.render();
        }

        // Action Modal Functions
        function openActionModal(jobId, title) {
            currentActionJobId = jobId;
            document.getElementById('modalJobTitle').innerText = title + ' - İşlemler';
            document.getElementById('commitMessage').value = '';
            document.getElementById('actionModal').style.display = 'flex';
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('actionModal').style.display = 'none';
        });

        document.getElementById('sendCommitBtn').addEventListener('click', () => {
            const msg = document.getElementById('commitMessage').value;
            if (!msg) {
                alert('Commit mesajı boş olamaz.');
                return;
            }
            CommitLogAPI.addCommit(currentActionJobId, currentUser.id, msg);
            alert('Commit başarıyla gönderildi (Simülasyon). Patronunuz GitHub loglarını panelinde görebilecek.');
            document.getElementById('commitMessage').value = '';
        });

        document.getElementById('submitReviewBtn').addEventListener('click', () => {
            if(confirm('İşi tamamladınız ve onaya gönderiyorsunuz. Emin misiniz?')) {
                JobAPI.updateJobStatus(currentActionJobId, 'Review');
                document.getElementById('actionModal').style.display = 'none';
                loadDashboard();
                alert('İş başarıyla onaya gönderildi.');
            }
        });

        // Init
        setTimeout(loadDashboard, 100); // small delay to ensure FullCalendar styles load
    </script>
</body>
</html>
